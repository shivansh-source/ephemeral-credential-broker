# One-command install manifest for the ephemeral credential broker (design
# doc section 7, Weekend 6: "Helm chart or single install manifest"). This
# is the concatenation of config/crd, config/rbac, and config/manager, in
# apply order -- kept here as a convenience so `kubectl apply -f
# https://.../dist/install.yaml` works without kustomize. config/ remains
# the source of truth; regenerate this file with `make build-installer` (see
# Makefile) if you change anything under config/.
#
# Before applying, build and push the controller image and update the
# `image:` field below (or run `make deploy IMG=...`, which does this via
# kustomize instead of this file).
apiVersion: v1
kind: Namespace
metadata:
  name: ephemeral-credential-broker-system
  labels:
    app.kubernetes.io/name: ephemeral-credential-broker
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ephemeralcredentials.broker.shivansh-sinha.dev
  labels:
    app.kubernetes.io/name: ephemeral-credential-broker
    app.kubernetes.io/managed-by: kustomize
spec:
  group: broker.shivansh-sinha.dev
  names:
    kind: EphemeralCredential
    listKind: EphemeralCredentialList
    plural: ephemeralcredentials
    singular: ephemeralcredential
    shortNames:
      - ecred
      - ecreds
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: State
          type: string
          jsonPath: .status.state
        - name: Expires
          type: date
          jsonPath: .status.expiresAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "!has(self.rotateBeforeSeconds) || self.rotateBeforeSeconds < self.ttlSeconds"
                  message: "rotateBeforeSeconds must be smaller than ttlSeconds"
                - rule: "self.provider != 'github-app' || has(self.providerConfig.github)"
                  message: "provider github-app requires providerConfig.github"
                - rule: "self.provider != 'aws-sts' || has(self.providerConfig.aws)"
                  message: "provider aws-sts requires providerConfig.aws"
                - rule: "self.provider != 'database' || has(self.providerConfig.database)"
                  message: "provider database requires providerConfig.database"
                - rule: "self.provider != 'vault' || has(self.providerConfig.vault)"
                  message: "provider vault requires providerConfig.vault"
              required:
                - provider
                - providerConfig
                - targetSecret
                - ttlSeconds
              properties:
                provider:
                  type: string
                  enum: ["github-app", "aws-sts", "database", "vault"]
                ttlSeconds:
                  type: integer
                  format: int32
                  minimum: 60
                rotateBeforeSeconds:
                  type: integer
                  format: int32
                  minimum: 30
                  default: 600
                targetSecret:
                  type: object
                  required: ["name"]
                  properties:
                    name:
                      type: string
                    keys:
                      type: object
                      additionalProperties:
                        type: string
                providerConfig:
                  type: object
                  properties:
                    github:
                      type: object
                      required: ["appConfigRef", "repositories"]
                      properties:
                        appConfigRef:
                          type: object
                          required: ["name"]
                          properties:
                            name:
                              type: string
                        repositories:
                          type: array
                          minItems: 1
                          items:
                            type: string
                        permissions:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      required: ["roleArn"]
                      properties:
                        roleArn:
                          type: string
                        sessionPolicy:
                          type: string
                        region:
                          type: string
                        durationSeconds:
                          type: integer
                          format: int32
                          minimum: 900
                    database:
                      type: object
                      required: ["engine", "adminSecretRef", "connectionRef"]
                      properties:
                        engine:
                          type: string
                          enum: ["postgres", "mysql"]
                        adminSecretRef:
                          type: object
                          required: ["name"]
                          properties:
                            name:
                              type: string
                        connectionRef:
                          type: object
                          required: ["name"]
                          properties:
                            name:
                              type: string
                        grants:
                          type: array
                          items:
                            type: string
                    vault:
                      type: object
                      required: ["backendRef", "path"]
                      properties:
                        backendRef:
                          type: object
                          required: ["name"]
                          properties:
                            name:
                              type: string
                        path:
                          type: string
                        renewable:
                          type: boolean
            status:
              type: object
              properties:
                state:
                  type: string
                  enum: ["Pending", "Active", "Expiring", "Failed"]
                expiresAt:
                  type: string
                  format: date-time
                lastRotatedAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required: ["lastTransitionTime", "message", "reason", "status", "type"]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
          required:
            - spec
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ephemeral-credential-broker-controller
  namespace: ephemeral-credential-broker-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ephemeral-credential-broker-manager-role
rules:
  - apiGroups: ["broker.shivansh-sinha.dev"]
    resources: ["ephemeralcredentials"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["broker.shivansh-sinha.dev"]
    resources: ["ephemeralcredentials/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["broker.shivansh-sinha.dev"]
    resources: ["ephemeralcredentials/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ephemeral-credential-broker-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ephemeral-credential-broker-manager-role
subjects:
  - kind: ServiceAccount
    name: ephemeral-credential-broker-controller
    namespace: ephemeral-credential-broker-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ephemeral-credential-broker-controller-manager
  namespace: ephemeral-credential-broker-system
  labels:
    app.kubernetes.io/name: ephemeral-credential-broker
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      serviceAccountName: ephemeral-credential-broker-controller
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: ephemeral-credential-broker:dev
          imagePullPolicy: IfNotPresent
          args:
            - --health-probe-bind-address=:8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      terminationGracePeriodSeconds: 10
