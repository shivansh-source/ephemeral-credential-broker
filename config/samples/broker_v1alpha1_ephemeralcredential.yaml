# Matches the worked example in design doc section 3.1. Before applying:
#   1. Register a GitHub App, install it on myorg/myrepo, and grant it
#      contents:read and issues:read.
#   2. Create the App credentials Secret this CR references:
#        kubectl create secret generic broker-github-app \
#          --from-literal=appId=<your App ID> \
#          --from-file=privateKey=<path to your App's private-key.pem> \
#          -n builds
#   3. kubectl apply -f this file.
apiVersion: broker.shivansh-sinha.dev/v1alpha1
kind: EphemeralCredential
metadata:
  name: ci-github-token
  namespace: builds
spec:
  provider: github-app
  ttlSeconds: 3600
  rotateBeforeSeconds: 600
  targetSecret:
    name: github-token
    keys:
      token: token
  providerConfig:
    github:
      appConfigRef:
        name: broker-github-app
      repositories:
        - myorg/myrepo
      permissions:
        contents: read
        issues: read
