# NOTE: hand-written to match api/v1alpha1/ephemeralcredential_types.go,
# because this sandbox could not install controller-gen (no network access
# to the Go module proxy). Run `make manifests` once controller-gen is
# available (see Makefile) to regenerate this from the Go types' kubebuilder
# markers -- it should come out equivalent; treat this file as a
# placeholder for that, not a substitute.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ephemeralcredentials.broker.shivansh-sinha.dev
  labels:
    app.kubernetes.io/name: ephemeral-credential-broker
    app.kubernetes.io/managed-by: kustomize
spec:
  group: broker.shivansh-sinha.dev
  names:
    kind: EphemeralCredential
    listKind: EphemeralCredentialList
    plural: ephemeralcredentials
    singular: ephemeralcredential
    shortNames:
      - ecred
      - ecreds
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: State
          type: string
          jsonPath: .status.state
        - name: Expires
          type: date
          jsonPath: .status.expiresAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            EphemeralCredential is the Schema for the ephemeralcredentials
            API. It is the entire user interface of the credential broker:
            a workload owner writes one of these, and the controller
            mints, rotates, and cleans up the underlying credential.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: EphemeralCredentialSpec is the desired state of an ephemeral credential.
              x-kubernetes-validations:
                - rule: "!has(self.rotateBeforeSeconds) || self.rotateBeforeSeconds < self.ttlSeconds"
                  message: "rotateBeforeSeconds must be smaller than ttlSeconds"
                - rule: "self.provider != 'github-app' || has(self.providerConfig.github)"
                  message: "provider github-app requires providerConfig.github"
                - rule: "self.provider != 'aws-sts' || has(self.providerConfig.aws)"
                  message: "provider aws-sts requires providerConfig.aws"
                - rule: "self.provider != 'database' || has(self.providerConfig.database)"
                  message: "provider database requires providerConfig.database"
                - rule: "self.provider != 'vault' || has(self.providerConfig.vault)"
                  message: "provider vault requires providerConfig.vault"
              required:
                - provider
                - providerConfig
                - targetSecret
                - ttlSeconds
              properties:
                provider:
                  type: string
                  description: Provider selects which Provider implementation mints this credential.
                  enum: ["github-app", "aws-sts", "database", "vault"]
                ttlSeconds:
                  type: integer
                  format: int32
                  minimum: 60
                  description: >-
                    Requested credential lifetime. The provider may grant a
                    shorter lifetime than requested -- the actual granted
                    expiry is always what status.expiresAt reports.
                rotateBeforeSeconds:
                  type: integer
                  format: int32
                  minimum: 30
                  default: 600
                  description: How long before status.expiresAt the controller re-mints the credential.
                targetSecret:
                  type: object
                  description: The Secret the minted credential is written into.
                  required:
                    - name
                  properties:
                    name:
                      type: string
                    keys:
                      type: object
                      additionalProperties:
                        type: string
                      description: >-
                        Maps a provider's logical output key (e.g. "token")
                        to the key it is written under in the target
                        Secret's data.
                providerConfig:
                  type: object
                  description: >-
                    Discriminated union keyed by spec.provider -- only the
                    block matching spec.provider is read.
                  properties:
                    github:
                      type: object
                      required:
                        - appConfigRef
                        - repositories
                      properties:
                        appConfigRef:
                          type: object
                          required: ["name"]
                          properties:
                            name:
                              type: string
                        repositories:
                          type: array
                          minItems: 1
                          items:
                            type: string
                        permissions:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      description: "Designed, not implemented in v1 -- design doc section 4.2."
                      required:
                        - roleArn
                      properties:
                        roleArn:
                          type: string
                        sessionPolicy:
                          type: string
                        region:
                          type: string
                        durationSeconds:
                          type: integer
                          format: int32
                          minimum: 900
                    database:
                      type: object
                      description: "Designed, not implemented in v1 -- design doc section 4.3."
                      required:
                        - engine
                        - adminSecretRef
                        - connectionRef
                      properties:
                        engine:
                          type: string
                          enum: ["postgres", "mysql"]
                        adminSecretRef:
                          type: object
                          required: ["name"]
                          properties:
                            name:
                              type: string
                        connectionRef:
                          type: object
                          required: ["name"]
                          properties:
                            name:
                              type: string
                        grants:
                          type: array
                          items:
                            type: string
                    vault:
                      type: object
                      description: "Designed, lowest priority, maybe never built -- design doc section 4.4."
                      required:
                        - backendRef
                        - path
                      properties:
                        backendRef:
                          type: object
                          required: ["name"]
                          properties:
                            name:
                              type: string
                        path:
                          type: string
                        renewable:
                          type: boolean
            status:
              type: object
              description: EphemeralCredentialStatus is the observed state of an ephemeral credential.
              properties:
                state:
                  type: string
                  enum: ["Pending", "Active", "Expiring", "Failed"]
                expiresAt:
                  type: string
                  format: date-time
                lastRotatedAt:
                  type: string
                  format: date-time
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
          required:
            - spec
